name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-tower:
    name: Control tower (lint + test + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-tower
    # Repo/org may inject VIRTUAL_ENV pointing at a root .venv; pin ours.
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/control-tower/.venv

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            control-tower/pyproject.toml
            control-tower/sdk/aiguard/pyproject.toml

      - name: Create venv and install
        run: |
          uv venv --clear "$VIRTUAL_ENV"
          # scale = sqlite checkpoint saver used by storage e2e; postgres tests
          # stay skipped via -m 'not postgres'. SDK needed by simulated-app e2e.
          uv pip install -e ".[dev,scale]" -e "./sdk/aiguard[langchain]"

      - name: Ruff
        run: $VIRTUAL_ENV/bin/ruff check .

      - name: Evidence docs eval report
        # Regenerates the checked-in report; fails if the file drifts.
        # Metrics are visible in reports/evidence_docs_eval.md — not asserted.
        run: |
          $VIRTUAL_ENV/bin/python scripts/eval_evidence_docs.py --write reports/evidence_docs_eval.md
          git diff --exit-code -- reports/evidence_docs_eval.md

      - name: Pytest (offline suite, ≥90% coverage)
        # addopts already excludes @pytest.mark.live and @pytest.mark.postgres.
        # Coverage uses tmp_path fixtures only — never writes to data/*.db.
        # fail_under=90 is set in pyproject.toml [tool.coverage.report].
        run: >
          $VIRTUAL_ENV/bin/pytest -q
          --cov=api --cov=agent --cov=audit --cov=guardrails
          --cov=configs --cov=contracts --cov=knowledge
          --cov=investigation_assistant
          --cov-report=term-missing:skip-covered

  control-tower-web:
    name: Control tower web (unit + e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-tower/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: control-tower/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Oxlint
        run: npm run lint

      - name: Unit / integration tests (≥90% coverage)
        # MSW mocks all /api calls — no real control-tower DB or API process.
        run: npm run test:coverage

      # Browser binaries live in ~/.cache/ms-playwright. OS packages are
      # reinstalled every run because hosted runners start clean.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('control-tower/web/package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E (Playwright, mocked API)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: control-tower/web/playwright-report/
          retention-days: 7

  sdk:
    name: AiGuard SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-tower/sdk/aiguard
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/control-tower/sdk/aiguard/.venv

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "control-tower/sdk/aiguard/pyproject.toml"

      - name: Create venv and install
        run: |
          uv venv --clear "$VIRTUAL_ENV"
          uv pip install -e ".[dev,langchain]"

      - name: Pytest
        run: $VIRTUAL_ENV/bin/pytest -q
