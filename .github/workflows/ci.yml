name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-tower:
    name: Control tower (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-tower

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: control-tower/pyproject.toml

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest (offline suite)
        # addopts already excludes @pytest.mark.live and @pytest.mark.postgres
        run: pytest -q

  sdk:
    name: AiGuard SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-tower/sdk/aiguard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: control-tower/sdk/aiguard/pyproject.toml

      - name: Install package + langchain extras
        run: pip install -e ".[dev,langchain]"

      - name: Pytest
        run: pytest -q
