name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-tower:
    name: Control tower (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-tower

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            control-tower/pyproject.toml
            control-tower/sdk/aiguard/pyproject.toml

      - name: Create venv and install
        run: |
          uv venv .venv
          # Simulated-app e2e tests import the SDK (scripts/simulated_apps/*).
          uv pip install -e ".[dev]" -e "./sdk/aiguard[langchain]"

      - name: Ruff
        run: .venv/bin/ruff check .

      - name: Pytest (offline suite)
        # addopts already excludes @pytest.mark.live and @pytest.mark.postgres
        run: .venv/bin/pytest -q

  sdk:
    name: AiGuard SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-tower/sdk/aiguard

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "control-tower/sdk/aiguard/pyproject.toml"

      - name: Create venv and install
        run: |
          uv venv .venv
          uv pip install -e ".[dev,langchain]"

      - name: Pytest
        run: .venv/bin/pytest -q
