[project]
name = "control-tower"
version = "0.1.0"
description = "Aegis — control tower for enterprise agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain-openai",
    "chromadb",
    "langchain",
    "fastapi",
    "uvicorn",
    "streamlit",
    "pydantic>=2.0",
    "pyyaml",
    "httpx",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agent*",
    "api*",
    "audit*",
    "configs*",
    "contracts*",
    "dashboard*",
    "guardrails*",
    "knowledge*",
    "investigation_assistant*",
    "scripts*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: tests that call the live OpenAI API",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"
