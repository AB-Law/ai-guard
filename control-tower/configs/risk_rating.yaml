process: risk_rating
allowed_tools:
  - name: assign_risk_rating
    max_auto_amount: 3
  - name: request_manual_review
    max_auto_amount: null
disallowed_tools:
  - suspend_account
required_evidence_docs:
  - risk_rating_policy
approval_threshold:
  risk_score_gte: 60
knowledge_base_paths:
  - ./data/risk_rating_policy.md
