process: procurement_review
allowed_tools:
  - name: create_purchase_order
    max_auto_amount: 10000
  - name: request_approval
    max_auto_amount: null
  # Added for the standalone procurement-copilot app's richer tool set —
  # none of these move money or commit the company to anything by
  # themselves (flag/ask/reject/escalate), so no dollar ceiling applies;
  # they can still be escalated/blocked via risk score or policy
  # entailment like any other tool call.
  - name: flag_duplicate_or_split_po
    max_auto_amount: null
  - name: request_documentation
    max_auto_amount: null
  - name: escalate_to_trade_compliance
    max_auto_amount: null
  - name: reject_request
    max_auto_amount: null
disallowed_tools:
  - send_payment
  - modify_vendor_banking_details
required_evidence_docs:
  - procurement_policy
  - vendor_master_list
approval_threshold:
  risk_score_gte: 60
knowledge_base_paths:
  - ./data/procurement_policy.md
  - ./data/enterprise_procurement_policy_addendum.md
  - ./data/vendor_master.csv
